# Checks every pull request and every push to main. It never deploys.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test
      # Separate step: type generation and the build both write apps/web/.next.
      - run: pnpm turbo run build
      - name: Bundle check (Three.js on demand only, initial JavaScript budget)
        run: pnpm --filter @virkum/web check:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: apps/web/out
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.project }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: mobile-chrome, browser: chromium }
          - { project: no-webgl, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: mobile-safari, browser: webkit }
          - { project: tablet, browser: webkit }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: apps/web/out
      - run: pnpm --filter @virkum/web exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --filter @virkum/web exec playwright test --project=${{ matrix.project }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: apps/web/playwright-report
          retention-days: 7
